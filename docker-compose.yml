version: '3.8'

services:
  # MediaMTX RTSP server
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"   # RTSP port
      - "1935:1935"   # RTMP port
      - "8888:8888"   # HLS port
      - "8889:8889"   # WebRTC port
    restart: unless-stopped

  # Blink Liveview Middleware
  blink-liveview:
    build: .
    environment:
      # Blink credentials (set these in your .env file or export them)
      - BLINK_REGION=${BLINK_REGION}
      - BLINK_TOKEN=${BLINK_TOKEN}
      - BLINK_DEVICE_TYPE=${BLINK_DEVICE_TYPE}
      - BLINK_ACCOUNT_ID=${BLINK_ACCOUNT_ID}
      - BLINK_NETWORK_ID=${BLINK_NETWORK_ID}
      - BLINK_CAMERA_ID=${BLINK_CAMERA_ID}
      # Output configuration
      - LIVEVIEW_OUTPUT=${LIVEVIEW_OUTPUT:-rtsp}
      - RTSP_BASE_URL=${RTSP_BASE_URL:-rtsp://mediamtx:8554}
    depends_on:
      - mediamtx
    restart: unless-stopped
